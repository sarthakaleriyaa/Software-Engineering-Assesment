name: sarthakaleriyaa-ci

"on":
  # Every branch, so feature branches get CI evidence before their PRs.
  push:
    branches: ["**"]
    paths:
      - "submissions/sarthakaleriyaa/**"
      - ".github/workflows/sarthakaleriyaa-ci.yml"
  pull_request:
    paths:
      - "submissions/sarthakaleriyaa/**"
      - ".github/workflows/sarthakaleriyaa-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sarthakaleriyaa-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: submissions/sarthakaleriyaa/backend
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Placeholders for CI only; no real secrets or API keys are used.
      DATABASE_URL: postgresql+psycopg://test:test@127.0.0.1:5432/test
      TEST_DATABASE_URL: postgresql+psycopg://test:test@127.0.0.1:5432/test
      JWT_SECRET_KEY: ci-only-secret-not-for-production
      DOCUMIND_DISABLE_DOTENV: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: submissions/sarthakaleriyaa/backend/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff check ../evaluation --config ruff.toml

      - name: Run tests (unit + Postgres/pgvector integration, LLM mocked)
        run: python -m pytest tests -q

      - name: Run offline evaluation (local provider, no API keys)
        working-directory: submissions/sarthakaleriyaa
        run: python evaluation/run_eval.py --label ci-baseline

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: submissions/sarthakaleriyaa
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate compose file
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Build backend image (API, worker, migrations)
        run: docker build -t documind-backend:ci backend

      - name: Image runs as non-root
        run: test "$(docker image inspect documind-backend:ci --format '{{.Config.User}}')" = "documind"