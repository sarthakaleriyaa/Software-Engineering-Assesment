# Render Blueprint for DocuMind (free plan: one web service + Postgres).
# In Render: New > Blueprint > this repository, and set the Blueprint path to
# submissions/sarthakaleriyaa/render.yaml. See README "Deployment".
#
# Free-plan constraints this file is built around (Render docs, checked 2026-10-30):
# - No free background workers, so the ingestion worker runs inside the web
#   service (RUN_EMBEDDED_WORKER=true). Same queue, retries and heartbeats.
# - The filesystem is ephemeral, so uploaded files are stored in Postgres
#   (document_blobs), not on disk.
# - No pre-deploy step on free instances, so migrations run at start
#   (RUN_MIGRATIONS_ON_START=true; the server does not start if they fail).
# - The service sleeps after 15 minutes idle (about 1 minute to wake), and a
#   free database expires after 30 days. Upgrade both plans for longer use.

services:
  - type: web
    name: documind
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./submissions/sarthakaleriyaa/backend/Dockerfile
    dockerContext: ./submissions/sarthakaleriyaa/backend
    healthCheckPath: /health/live
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: documind-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_GENERATION_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: GEMINI_TIMEOUT_MS
        value: "30000"
      - key: RUN_EMBEDDED_WORKER
        value: "true"
      - key: RUN_MIGRATIONS_ON_START
        value: "true"
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: MAX_UPLOAD_MB
        value: "10"
      - key: FORWARDED_ALLOW_IPS
        value: "*"

databases:
  - name: documind-db
    plan: free
    region: singapore
    databaseName: documind
    user: documind
    postgresMajorVersion: "17"
